version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    assignees:
      - Pingue
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    ignore:
      # pyperdeck imports telnetlib, which was removed in Python 3.13
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: weekly
    assignees:
      - Pingue
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - Pingue
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
