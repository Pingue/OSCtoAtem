name: Release

# On every push to main: run the tests, work out the next semantic version from
# the Conventional Commits since the last tag, and (if anything is releasable)
# build and publish the Docker image, tag the commit and create a GitHub release.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and release
      packages: write   # push the image to GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history and tags, needed to find the last version

      - name: Work out next version
        id: version
        run: |
          version="$(python3 scripts/next_version.py)"
          if [ -z "$version" ]; then
            echo "No releasable commits (feat/fix/perf/breaking) since the last tag."
          else
            echo "Next version: $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            python3 scripts/next_version.py --notes > "$RUNNER_TEMP/notes.md"
          fi

      - name: Docker metadata
        if: steps.version.outputs.version
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.version

      - uses: docker/login-action@v4
        if: steps.version.outputs.version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.version.outputs.version
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag commit and create release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
